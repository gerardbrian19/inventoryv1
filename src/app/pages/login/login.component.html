<div class="login-bg min-h-screen flex items-center justify-center p-4">
  <mat-card class="login-card w-full max-w-md">
    <mat-card-header class="flex flex-col items-center pb-6 pt-2">
      <div class="brand-icon mb-4">
        <mat-icon>inventory_2</mat-icon>
      </div>
      <mat-card-title class="text-2xl font-bold text-center">Welcome Back</mat-card-title>
      <mat-card-subtitle class="text-center mt-1">Sign in to InvenTrack</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="login()" #loginForm="ngForm" class="flex flex-col gap-4">

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Username</mat-label>
          <input
            matInput
            [(ngModel)]="username"
            name="username"
            placeholder="Enter your username"
            required
            autocomplete="username"
          />
          <mat-icon matPrefix class="mr-2">person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Password</mat-label>
          <input
            matInput
            [(ngModel)]="password"
            name="password"
            [type]="hidePassword ? 'password' : 'text'"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <mat-icon matPrefix class="mr-2">lock</mat-icon>
          <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Role</mat-label>
          <mat-select [(ngModel)]="role" name="role">
            @for (r of roles; track r) {
              <mat-option [value]="r">{{ r }}</mat-option>
            }
          </mat-select>
          <mat-icon matPrefix class="mr-2">badge</mat-icon>
        </mat-form-field>

        @if (errorMessage) {
          <div class="error-banner flex items-center gap-2 px-3 py-2 rounded">
            <mat-icon class="text-red-600">error_outline</mat-icon>
            <span class="text-sm text-red-700">{{ errorMessage }}</span>
          </div>
        }

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="w-full py-3 text-base font-semibold mt-2"
        >
          Sign In
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
