<mat-toolbar class="navbar-toolbar" color="primary">
  <div class="flex items-center gap-2">
    <mat-icon>inventory_2</mat-icon>
    <span class="text-xl font-semibold tracking-wide">InvenTrack</span>
  </div>

  <div class="flex items-center gap-1 ml-8 hidden md:flex">
    @for (link of navLinks; track link.path) {
      <a
        mat-button
        [routerLink]="link.path"
        routerLinkActive="nav-active"
        class="nav-link-btn"
      >
        <mat-icon class="mr-1 text-sm">{{ link.icon }}</mat-icon>
        {{ link.label }}
      </a>
    }
  </div>

  <span class="flex-1"></span>

  <button
    mat-icon-button
    (click)="themeService.toggle()"
    [matTooltip]="themeService.isDark() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    aria-label="Toggle dark mode"
  >
    <mat-icon>{{ themeService.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button (click)="toggleCart()" aria-label="Cart">
    @if (itemCount() > 0) {
      <mat-icon [matBadge]="itemCount()" matBadgeColor="accent" matBadgeSize="small">shopping_cart</mat-icon>
    } @else {
      <mat-icon>shopping_cart</mat-icon>
    }
  </button>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="User menu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>

<app-cart-sidebar [isOpen]="cartOpen" (closeCart)="closeCart()" />
